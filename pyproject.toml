[project]
name = "skills"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
# Skill reference catalogues hand-lay-out their Python examples.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W",  # pycodestyle/pyflakes defaults + warnings
    "B",           # bugbear: likely bugs, incl. silent zip truncation
    "PLE", "PLW",  # pylint errors/warnings, incl. subprocess.run without check=
    "I",           # import order
    "UP",          # syntax upgrades for requires-python
    "SIM", "C4", "PIE", "PERF",  # simplifications and churn
    "RUF",         # ruff-specific, incl. RUF100 unused noqa
    "BLE",         # blind `except Exception` (Error Washing)
    "ARG",         # unused arguments (Dead Plumbing)
    "PGH",         # blanket noqa / type: ignore
    "PT",          # flake8-pytest-style
    "N",           # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
# CandidateProbes and TestProbes inherit from ast.NodeVisitor via CandidateRecords;
# `visit_<ASTNode>` methods and class-attribute aliases follow stdlib visitor dispatch.
"engineering/anti-defensive-coding/scripts/adc_scanner/probes_*.py" = ["N802", "N815"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["engineering/anti-defensive-coding/tests"]
python_classes = ["*Tests", "Test*"]
# The read-only worktree test asserts `git status --ignored` is unchanged, so
# pytest must not create `.pytest_cache`; run as `python -B -m pytest`.
addopts = ["-p", "no:cacheprovider"]
